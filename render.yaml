services:
  - type: web
    name: golu-examprep
    runtime: node
    region: singapore   # closest to India — change to 'ohio' for US
    plan: free          # upgrade to 'starter' for no sleep
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false    # You will enter this manually in Render dashboard → Environment
    healthCheckPath: /
    autoDeploy: true
